services:
  detector:
    build: .
    container_name: redline-detector
    restart: unless-stopped
    # Only reachable from this computer. If n8n runs inside Docker and cannot connect,
    # change this to "8000:8000" (and keep your firewall on).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_ID: fakespot-ai/roberta-base-ai-text-detection-v1
      # AI_LABEL: ""        # only set this if /health says the labels were guessed
    volumes:
      - hf-cache:/models    # the model downloads once and is kept here

volumes:
  hf-cache:
